<section class="mb-4">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
    <div>
      <h2 class="fw-bold mb-1">
        <i class="bi bi-book-half text-primary me-2"></i>Biblioteca Personal
      </h2>
      <p class="text-muted mb-0">
        Selección de obras literarias y técnicas destacadas.
      </p>
    </div>
    <span class="badge bg-dark fs-6 mt-2 mt-md-0">{{ libros.length }} Libros</span>
  </div>

  <div class="row g-4">
    @for (libro of libros; track libro.titulo) {
      <div class="col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm border-0">
          <img
            [src]="libro.portadaUrl"
            [alt]="libro.titulo"
            class="card-img-top object-fit-cover"
            style="height: 280px;"
          />
          <div class="card-body d-flex flex-column">
            <div class="mb-2">
              <span class="badge bg-primary-subtle text-primary">{{ libro.genero }}</span>
            </div>

            <h3 class="h6 fw-bold card-title mb-1">{{ libro.titulo }}</h3>
            <p class="text-muted small mb-2">{{ libro.autor }}</p>
            <p class="card-text small flex-grow-1 mb-0">{{ libro.sinopsis }}</p>
          </div>
        </div>
      </div>
    }
  </div>
</section>
