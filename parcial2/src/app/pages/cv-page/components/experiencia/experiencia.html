<div class="card shadow-sm border-0 mb-4">
  <div class="card-header bg-white border-bottom-0 pt-3">
    <h4 class="h5 fw-bold mb-0">
      <i class="bi bi-briefcase-fill text-primary me-2"></i>Experiencia y Proyectos
    </h4>
  </div>
  <div class="card-body">
    @for (proyecto of proyectos; track proyecto.puesto) {
      <div class="mb-4 pb-2 border-bottom">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h5 class="h6 fw-bold mb-0">{{ proyecto.puesto }}</h5>
            <span class="text-muted small">{{ proyecto.empresa }}</span>
          </div>
          <span class="badge bg-secondary">{{ proyecto.periodo }}</span>
        </div>
        <p class="small mt-2 mb-2">{{ proyecto.descripcion }}</p>
        <div class="d-flex flex-wrap gap-1">
          @for (tech of proyecto.tecnologias; track tech) {
            <span class="badge bg-light text-dark border">{{ tech }}</span>
          }
        </div>
      </div>
    }
  </div>
</div>
