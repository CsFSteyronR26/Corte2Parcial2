<div class="card shadow-sm border-0 mb-4">
  <div class="card-header bg-white border-bottom-0 pt-3">
    <h4 class="h5 fw-bold mb-0">
      <i class="bi bi-mortarboard-fill text-primary me-2"></i>Formación Académica
    </h4>
  </div>
  <div class="card-body">
    @for (estudio of estudios; track estudio.titulo) {
      <div class="border-start border-3 border-primary ps-3 mb-3">
        <div class="d-flex justify-content-between align-items-center">
          <h5 class="h6 fw-bold mb-0">{{ estudio.titulo }}</h5>
          <span class="badge bg-primary-subtle text-primary">{{ estudio.estado }}</span>
        </div>
        <p class="text-muted small mb-0">{{ estudio.institucion }} • {{ estudio.periodo }}</p>
      </div>
    }
  </div>
</div>
