<div class="card shadow-sm border-0 mb-4">
  <div class="card-body text-center p-4">
    <img
      [src]="datosPerfil.fotoUrl"
      [alt]="datosPerfil.nombre"
      class="rounded-circle img-thumbnail mb-3"
      width="140"
      height="140"
    />
    <h3 class="h4 fw-bold mb-1">{{ datosPerfil.nombre }}</h3>
    <p class="text-primary fw-semibold mb-2">{{ datosPerfil.titulo }}</p>
 
    <hr />

    <ul class="list-unstyled text-start small mb-0">
      <li class="mb-2">
        <i class="bi bi-geo-alt-fill text-danger me-2"></i>{{ datosPerfil.ciudad }}
      </li>
      <li class="mb-2">
        <i class="bi bi-envelope-fill text-primary me-2"></i>{{ datosPerfil.correo }}
      </li>
      
    </ul>
  </div>
</div>
